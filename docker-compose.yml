services:
  dietordie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dietordie-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:////app/data/dietordie.db
      - SECRET_KEY=${SECRET_KEY:-dietordie-super-secret-key-prod-2026}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.2-11b-vision-instruct:free}
      - ESP32_API_KEY=${ESP32_API_KEY:-esp32-dietordie-secret-token}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - DOMAIN=${DOMAIN:-dietordie.duckdns.org}
    networks:
      - default
      - edge
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dietordie-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
    networks:
      - default

networks:
  default:
  edge:
    external: true
    name: public-edge

